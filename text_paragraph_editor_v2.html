:root{--p:#6530b9;--bg:#f5f3f8;--line:#d7cfe2;--ink:#1d1725;--muted:#655d70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}header{display:flex;gap:14px;align-items:center;padding:14px 20px;background:white;border-bottom:1px solid var(--line)}header img{width:54px;border-radius:12px}h1{font-size:1.35rem;margin:0}header p{margin:2px 0;color:var(--muted)}.bar{position:sticky;top:0;z-index:10;background:#fffe;padding:12px 18px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:9px;align-items:end}label{font-size:.86rem;font-weight:700}input,select,button{font:inherit}input[type=file],input[type=text],select{display:block;width:100%;min-height:38px;margin-top:4px;padding:6px;border:1px solid #907f9f;border-radius:6px;background:white}button{min-height:38px;padding:7px 12px;border:1px solid var(--p);border-radius:6px;background:var(--p);color:white;font-weight:700;cursor:pointer}button.alt{background:white;color:var(--p)}button:disabled{opacity:.45}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:end}.row label{min-width:180px}.status{margin-top:8px;padding:7px 10px;border-left:4px solid var(--p);background:#f0eafb}.ok{background:#eaf7ee}.error{background:#fff0f0;color:#9b2020}main{max-width:1100px;margin:18px auto 70px;padding:0 14px}.info{color:var(--muted);margin-bottom:8px}.doc{min-height:430px;padding:22px;background:white;border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 14px #0001}.placeholder{text-align:center;color:var(--muted);padding:90px 10px}.seg{position:relative;margin:0 0 12px;padding:10px 44px 10px 12px;border:1px solid transparent;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}.seg:hover,.seg.active{background:#fff7d7;border-color:#cfae32}.seg [contenteditable=true]{outline:none}.seg.editable{border-color:#c8b5df}.mark{position:absolute;right:9px;top:8px;border-radius:14p <script>"use strict";const $=x=>document.getElementById(x),file=$('file'),mode=$('mode'),custom=$('custom'),edit=$('edit'),doc=$('doc'),status=$('status'),info=$('info'),changes=$('changes'),list=$('list'),voice=$('voice');let source='',name='untitled.txt',size=0,segs=[],next=1,selected=0,speaking=false;
function stat(t,c=''){status.textContent=t;status.className='status '+c}function norm(s){return s.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').replace(/\0/g,'')}function isHead(s){let t=s.trim();return t.length<140&&(/^#{1,6}\s/.test(t)||/^[A-Z][A-Z0-9 '&(),.:\-]{3,}$/.test(t)||/^(chapter|part|section|appendix)\b/i.test(t))}function isSep(s){return /^([=+\-_*~#])\1{2,}$/.test(s.trim())}function add(t,k='text'){t=t.replace(/^\n+|\n+$/g,'');if(t.trim())segs.push({original:t,current:t,kind:k,change:null})}
function parse(){segs=[];let s=norm(source),m=mode.value;if(m==='line')s.split('\n').forEach(x=>x.trim()&&add(x,isHead(x)?'heading':isSep(x)?'separator':'text'));else if(m==='literal'){let d=custom.value;if(!d)throw Error('Enter custom separator text.');s.split(d).forEach(add)}else if(m==='regex'){let r;try{r=new RegExp(custom.value,'gm')}catch(e){throw Error('Invalid regular expression: '+e.message)}s.split(r).forEach(add)}else if(m==='sentences'){let a=s.replace(/\n+/g,' ').match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g)||[s];for(let i=0;i<a.length;i+=3)add(a.slice(i,i+3).join(' ').trim())}else if(m==='headings'){let b=[],flush=()=>{if(b.length)add(b.join('\n'));b=[]};for(let x of s.split('\n')){if(!x.trim())flush();else if(isHead(x)||isSep(x)){flush();add(x,isHead(x)?'heading':'separator')}else b.push(x)}flush()}else s.split(/\n[\t ]*\n+/).forEach(add);if(!segs.length)add('')}
function refresh(){doc.replaceChildren();let f=document.createDocumentFragment();segs.forEach((s,i)=>{let d=document.createElement('div');d.className='seg '+s.kind+(edit.value!=='view'?' editable':'');d.dataset.i=i;d.tabIndex=0;let p=document.createElement('div');p.textContent=s.current;if(edit.value!=='view'){p.contentEditable='true';p.spellcheck=true;p.oninput=()=>changed(i,p.innerText)}d.onclick=()=>select(i);d.appendChild(p);if(edit.value==='tracked'&&s.change){let m=document.createElement('span');m.className='mark';m.textContent=s.change;d.appendChild(m)}f.appendChild(d)});doc.appendChild(f);renderNotes();$('save').disabled=$('savehtml').disabled=$('speak').disabled=false;$('discard').disabled=!segs.some(x=>x.current!==x.original);info.textContent=`${name} | ${size.toLocaleString()} bytes | ${segs.length.toLocaleString()} segments`;stat('Document ready. Click a segment to select it for speech.','ok')}
function render(reparse=false){try{if(reparse)parse();refresh()}catch(e){stat(e.message,'error')}}function changed(i,v){let s=segs[i];s.current=v;if(edit.value==='tracked'&&v!==s.original&&!s.change)s.change=next++;if(v===s.original)s.change=null;refreshNotesOnly();let d=doc.querySelector(`[data-i="${i}"]`),m=d.querySelector('.mark');if(edit.value==='tracked'&&s.change&&!m){m=document.createElement('span');m.className='mark';m.textContent=s.change;d.appendChild(m)}else if((!s.change||edit.value!=='tracked')&&m)m.remove();$('discard').disabled=!segs.some(x=>x.current!==x.original)}function renderNotes(){changes.classList.toggle('hidden',edit.value!=='tracked');refreshNotesOnly()}function refreshNotesOnly(){list.replaceChildren();let a=segs.filter(x=>x.change).sort((a,b)=>a.change-b.change);if(!a.length){list.textContent='No modifications recorded.';return}a.forEach(x=>{let d=document.createElement('div');d.className='change';let h=document.createElement('strong');h.textContent='Modification '+x.change;let p=document.createElement('pre');p.textContent='Original: '+x.original+'\nChanged to: '+x.current;d.append(h,p);list.appendChild(d)})}function select(i){selected=i;doc.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',+x.dataset.i===i))}
async function unzipEntry(buf,wanted){let u=new Uint8Array(buf),v=new DataView(buf),p=0;while(p+30<u.length&&v.getUint32(p,true)===0x04034b50){let method=v.getUint16(p+8,true),cs=v.getUint32(p+18,true),ns=v.getUint16(p+26,true),es=v.getUint16(p+28,true),n=new TextDecoder().decode(u.slice(p+30,p+30+ns)),start=p+30+ns+es,data=u.slice(start,start+cs);if(n===wanted){if(method===0)return data;if(method===8&&'DecompressionStream'in window){let ds=new DecompressionStream('deflate-raw');return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())}throw Error('This browser cannot decompress the Word document. Try current Edge or Chrome.')}p=start+cs}throw Error('The Word document does not contain '+wanted)}
async function readDocx(f){let xml=new TextDecoder().decode(await unzipEntry(await f.arrayBuffer(),'word/document.xml'));let dom=new DOMParser().parseFromString(xml,'application/xml');if(dom.querySelector('parsererror'))throw Error('The Word document XML could not be read.');let paras=[...dom.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')).filter(x=>x.trim());return paras.join('\n\n')}
file.onchange=async()=>{let f=file.files[0];if(!f)return;try{stat('Loading '+f.name+'...');source=f.name.toLowerCase().endsWith('.docx')?await readDocx(f):await f.text();name=f.name;size=f.size;if(!source.trim())throw Error('The selected document contains no readable text.');parse();next=1;refresh()}catch(e){stat('Could not open document: '+e.message,'error')}};$('blank').onclick=()=>{speechSynthesis.cancel();source='Start typing here.';name='untitled.txt';size=0;mode.value='blank';edit.value='direct';parse();refresh();setTimeout(()=>{let e=doc.querySelector('[contenteditable]');e.focus();document.execCommand('selectAll',false,null)},0)};$('reprocess').onclick=()=>render(true);[mode,custom].forEach(e=>e.onchange=()=>{if(source)render(true)});edit.onchange=()=>source&&refresh();$('discard').onclick=()=>{segs.forEach(x=>{x.current=x.original;x.change=null});next=1;refresh()};
function textOut(){let out=segs.map(x=>x.current+(edit.value==='tracked'&&x.change?` [${x.change}]`:'')).join('\n\n'),a=segs.filter(x=>x.change).sort((a,b)=>a.change-b.change);if(edit.value==='tracked'&&a.length){out+='\n\n==== MODIFICATION NOTES ====\n';a.forEach(x=>out+=`\n[${x.change}]\nOriginal: ${x.original}\nChanged to: ${x.current}\n`)}return out}function dl(n,t,s){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}$('save').onclick=()=>dl(name.replace(/\.[^.]+$/,'')+'-edited.txt','text/plain;charset=utf-8',textOut());$('savehtml').onclick=()=>dl(name.replace(/\.[^.]+$/,'')+'-edited.html','text/html;charset=utf-8','<!doctype html><meta charset="utf-8"><title>Edited document</title><style>body{max-width:900px;margin:40px auto;font:18px/1.6 Arial;white-space:pre-wrap}</style>'+textOut().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])));
let voices=[];function voicesLoad(){voices=speechSynthesis.getVoices();let keep=voice.value,local=$('local').checked;voice.replaceChildren();voices.filter(v=>!local||v.localService).forEach(v=>{let o=document.createElement('option');o.value=voices.indexOf(v);o.textContent=v.name+' ('+v.lang+')'+(v.localService?' [local]':' [possibly online]');voice.appendChild(o)});if([...voice.options].some(o=>o.value===keep))voice.value=keep}voicesLoad();speechSynthesis.onvoiceschanged=voicesLoad;$('local').onchange=voicesLoad;$('speak').onclick=()=>{speechSynthesis.cancel();speaking=true;$('pause').disabled=$('stop').disabled=false;let i=selected||0;function go(){if(!speaking||i>=segs.length){speaking=false;return}select(i);doc.querySelector(`[data-i="${i}"]`).scrollIntoView({block:'center',behavior:'smooth'});let u=new SpeechSynthesisUtterance(segs[i].current);let idx=+voice.value;if(voices[idx])u.voice=voices[idx];u.rate=+$('rate').value;u.onend=()=>{i++;go()};u.onerror=()=>{speaking=false;stat('Speech stopped because the selected voice reported an error.','error')};speechSynthesis.speak(u)}go()};$('pause').onclick=()=>{if(speechSynthesis.paused){speechSynthesis.resume();$('pause').textContent='Pause'}else{speechSynthesis.pause();$('pause').textContent='Resume'}};$('stop').onclick=()=>{speaking=false;speechSynthesis.cancel();$('pause').textContent='Pause'};window.onerror=(m)=>stat('Page script error: '+m,'error');</script></body></html>
